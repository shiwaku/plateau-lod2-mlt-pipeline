<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>plateau-lod2-mlt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css">
  <!-- MapLibre GL JS 6.x ships as ES modules only; pmtiles.js keeps a UMD build. -->
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(255,255,255,.92); color: #222; font: 13px/1.5 system-ui, sans-serif;
      padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 300px;
    }
    #panel h1 { font-size: 14px; margin: 0 0 6px; }
    #panel label { display: block; cursor: pointer; }
    #panel hr { border: 0; border-top: 1px solid #ccc; margin: 8px 0; }
    #stats { color: #555; font-size: 12px; white-space: pre-line; }
    #panel a { color: #1d508e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>plateau-lod2-mlt</h1>
    <div id="sources"></div>
    <hr>
    <label><input type="checkbox" id="byLod"> LOD 別に色分け（青 = LOD2 屋根面、橙 = LOD0 屋根伏せ）</label>
    <hr>
    <div id="stats"></div>
    <hr>
    <div style="font-size:12px">
      データ: <a href="https://www.geospatial.jp/ckan/dataset/plateau-13101-chiyoda-ku-2025" target="_blank" rel="noopener">PLATEAU 千代田区 2025</a><br>
      変換規則: <a href="https://github.com/indigo-lab/plateau-lod2-mvt" target="_blank" rel="noopener">indigo-lab/plateau-lod2-mvt</a> 準拠
    </div>
  </div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

    // Tile locations.  Override with ?base=https://host/path (no trailing slash) for remote hosting.
    const params = new URLSearchParams(location.search);
    // Must be absolute: tile URLs are resolved inside MapLibre's worker, where relative paths fail.
    const BASE = new URL((params.get('base') || './dist').replace(/\/$/, ''), location.href).href;
    const NAME = params.get('name') || 'chiyoda-lod2';

    const SOURCES = {
      'mlt-pmtiles': {
        label: 'MLT / PMTiles',
        source: { type: 'vector', encoding: 'mlt', url: `pmtiles://${BASE}/${NAME}.mlt.pmtiles` },
      },
      'mvt-pmtiles': {
        label: 'MVT / PMTiles',
        source: { type: 'vector', url: `pmtiles://${BASE}/${NAME}.mvt.pmtiles` },
      },
      'mlt-dir': {
        label: 'MLT / {z}/{x}/{y}.mlt ディレクトリ',
        source: { type: 'vector', encoding: 'mlt', tiles: [`${BASE}/${NAME}/{z}/{x}/{y}.mlt`], minzoom: 10, maxzoom: 16 },
      },
    };
    const ATTRIBUTION = "<a href='https://github.com/indigo-lab/plateau-lod2-mvt'>plateau-lod2-mvt</a> の規則で <a href='https://www.mlit.go.jp/plateau/'>国土交通省 Project PLATEAU</a> のデータを加工して作成";

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    // indigo-lab colour ramp: colour by the ones digit of the height in metres.
    const HEIGHT_M = ['*', ['get', 'z_cm'], 0.01];
    const COLOR_BY_HEIGHT = [
      'interpolate-lab', ['linear'],
      ['%', ['round', ['*', 10, HEIGHT_M]], 10],
      0, '#d95d2a', 1, '#d95d2a', 2, '#f8df4a', 3, '#f8df4a', 4, '#1d508e',
      5, '#1d508e', 6, '#3c782e', 7, '#3c782e', 8, '#845c40', 9, '#726f62',
    ];
    const COLOR_BY_LOD = ['match', ['get', 'lod'], 2, '#1d508e', '#d95d2a'];

    function buildStyle(sourceKey) {
      const src = { ...SOURCES[sourceKey].source, attribution: ATTRIBUTION };
      return {
        version: 8,
        glyphs: 'https://maps.gsi.go.jp/xyz/noto-jp/{fontstack}/{range}.pbf',
        sources: {
          pale: {
            type: 'raster',
            tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
            minzoom: 5, maxzoom: 18, tileSize: 256,
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html'>地理院タイル</a>",
          },
          bldg: src,
        },
        layers: [
          { id: 'pale', type: 'raster', source: 'pale', minzoom: 5, maxzoom: 20 },
          {
            id: 'fill-extrusion-bldg', type: 'fill-extrusion', source: 'bldg', 'source-layer': 'bldg',
            minzoom: 10, maxzoom: 20,
            filter: ['has', 'z_cm'],
            paint: {
              'fill-extrusion-color': document.getElementById('byLod').checked ? COLOR_BY_LOD : COLOR_BY_HEIGHT,
              'fill-extrusion-height': HEIGHT_M,
              'fill-extrusion-opacity': 0.95,
            },
          },
        ],
      };
    }

    let current = params.get('source') in SOURCES ? params.get('source') : 'mlt-pmtiles';
    const map = new maplibregl.Map({
      container: 'map',
      style: buildStyle(current),
      center: [139.7648, 35.6812],   // 東京駅・丸の内
      zoom: 15.5, pitch: 60, bearing: -20, hash: true,
      maxPitch: 75,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    // --- UI -----------------------------------------------------------------
    const sourcesDiv = document.getElementById('sources');
    for (const [key, def] of Object.entries(SOURCES)) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio'; input.name = 'source'; input.value = key; input.checked = key === current;
      input.addEventListener('change', () => switchSource(key));
      label.append(input, ' ', def.label);
      sourcesDiv.append(label);
    }
    document.getElementById('byLod').addEventListener('change', (e) => {
      map.setPaintProperty('fill-extrusion-bldg', 'fill-extrusion-color', e.target.checked ? COLOR_BY_LOD : COLOR_BY_HEIGHT);
    });

    // --- simple transfer statistics (tiles + bytes per source, via Resource Timing) ---
    const stats = { tiles: 0, bytes: 0, t0: performance.now() };
    const statsDiv = document.getElementById('stats');
    function isTileRequest(name) {
      return name.includes(`/${NAME}.mlt.pmtiles`) || name.includes(`/${NAME}.mvt.pmtiles`) || /\.mlt(\?|$)/.test(name);
    }
    const observer = new PerformanceObserver((list) => {
      for (const e of list.getEntries()) {
        if (!isTileRequest(e.name)) continue;
        stats.tiles += 1;
        stats.bytes += e.transferSize || e.encodedBodySize || 0;
      }
      render();
    });
    observer.observe({ type: 'resource', buffered: true });
    function render() {
      const note = current === 'mlt-dir'
        ? '(ディレクトリ配信のタイルは Worker が取得するためここでは計測できません。DevTools の Network を参照)'
        : '(PMTiles は Range リクエスト単位。ソース切替でリセット)';
      statsDiv.textContent =
        `${SOURCES[current].label}\n` +
        `リクエスト: ${stats.tiles}  転送量: ${(stats.bytes / 1024).toFixed(0)} KB\n` + note;
    }
    render();

    function switchSource(key) {
      current = key;
      stats.tiles = 0; stats.bytes = 0; stats.t0 = performance.now();
      performance.clearResourceTimings();
      map.setStyle(buildStyle(key));
      render();
    }

    window.map = map;  // for debugging in the console
    map.on('error', (e) => {
      const err = e && e.error ? e.error : e;
      console.error('[map error]', err && err.message ? err.message : err, e && e.tile ? `tile ${e.tile.tileID.canonical.z}/${e.tile.tileID.canonical.x}/${e.tile.tileID.canonical.y}` : '', e && e.sourceId ? `source ${e.sourceId}` : '');
    });
    map.on('click', 'fill-extrusion-bldg', (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`高さ ${(p.z_cm / 100).toFixed(1)} m<br>lod ${p.lod}${p.id ? '<br>id ' + p.id : ''}`)
        .addTo(map);
    });
  </script>
</body>
</html>
