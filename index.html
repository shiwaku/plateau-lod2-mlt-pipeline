<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>plateau-mlt-pipeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css">
  <!-- MapLibre GL JS 6.x ships as ES modules only; pmtiles.js keeps a UMD build. -->
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(255,255,255,.92); color: #222; font: 13px/1.5 system-ui, sans-serif;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 300px;
    }
    #panel summary {
      list-style: none; cursor: pointer; font-weight: 600; font-size: 14px; padding: 8px 12px;
      display: flex; align-items: center; gap: 8px; user-select: none;
    }
    #panel summary::-webkit-details-marker { display: none; }
    #panel summary::after { content: '▾'; margin-left: auto; color: #666; transition: transform .15s; }
    #panel details:not([open]) summary::after { transform: rotate(-90deg); }
    #panel .body { padding: 0 12px 10px; }
    #panel label { display: block; cursor: pointer; padding: 2px 0; }
    #panel input[type=radio], #panel input[type=checkbox] { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
    #panel hr { border: 0; border-top: 1px solid #ccc; margin: 8px 0; }
    #stats { color: #555; font-size: 12px; white-space: pre-line; }
    #panel a { color: #1d508e; }
    /* phones: full-width sheet at the top, collapsed by default (see script) */
    @media (max-width: 600px) {
      #panel {
        top: 0; left: 0; right: 0; max-width: none; border-radius: 0 0 8px 8px;
        padding-top: env(safe-area-inset-top);
      }
      #panel .body { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      #panel label { padding: 6px 0; }
      .maplibregl-ctrl-top-right { top: calc(env(safe-area-inset-top) + 46px); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <details id="panelDetails" open>
      <summary>plateau-mlt-pipeline</summary>
      <div class="body">
        <div id="sources"></div>
        <hr>
        <label><input type="checkbox" id="byLod"> LOD 別に色分け（青 = LOD2 屋根面、橙 = LOD1 屋根伏せ）</label>
        <hr>
        <div id="stats"></div>
        <hr>
        <div style="font-size:12px">
          データ: <a href="https://www.geospatial.jp/ckan/dataset/plateau-13101-chiyoda-ku-2025" target="_blank" rel="noopener">PLATEAU 千代田区 2025</a><br>
          変換規則: <a href="https://github.com/indigo-lab/plateau-lod2-mvt" target="_blank" rel="noopener">indigo-lab/plateau-lod2-mvt</a> 準拠<br>
          背景: <a href="https://github.com/gsi-cyberjapan/optimal_bvmap" target="_blank" rel="noopener">国土地理院 最適化ベクトルタイル</a>（淡色地図風スタイル）
        </div>
      </div>
    </details>
  </div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

    // Tile locations.  Override with ?base=https://host/path (no trailing slash) for remote hosting.
    // Must be absolute: tile URLs are resolved inside MapLibre's worker, where relative paths fail.
    const params = new URLSearchParams(location.search);
    const BASE = new URL((params.get('base') || './dist').replace(/\/$/, ''), location.href).href;
    const NAME = params.get('name') || 'chiyoda-lod2';

    const SOURCES = {
      'mlt-pmtiles': {
        label: 'MLT / PMTiles',
        source: { type: 'vector', encoding: 'mlt', url: `pmtiles://${BASE}/${NAME}.mlt.pmtiles` },
      },
      'mvt-pmtiles': {
        label: 'MVT / PMTiles',
        source: { type: 'vector', url: `pmtiles://${BASE}/${NAME}.mvt.pmtiles` },
      },
    };
    const ATTRIBUTION = "<a href='https://github.com/indigo-lab/plateau-lod2-mvt'>plateau-lod2-mvt</a> の規則で <a href='https://www.mlit.go.jp/plateau/'>国土交通省 Project PLATEAU</a> のデータを加工して作成";

    // Base map: GSI optimal vector tiles (PMTiles) with the GSI "pale" style
    // (style/gsi-pale.json, from gsi-cyberjapan/3dpc-3dtiles public/styles/pale.json).
    const GSI_STYLE_URL = new URL('./style/gsi-pale.json', location.href).href;

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    // ---- our 3D building layer --------------------------------------------------
    // indigo-lab colour ramp: colour by the ones digit of the height in metres.
    const HEIGHT_M = ['*', ['get', 'z_cm'], 0.01];
    const COLOR_BY_HEIGHT = [
      'interpolate-lab', ['linear'],
      ['%', ['round', ['*', 10, HEIGHT_M]], 10],
      0, '#d95d2a', 1, '#d95d2a', 2, '#f8df4a', 3, '#f8df4a', 4, '#1d508e',
      5, '#1d508e', 6, '#3c782e', 7, '#3c782e', 8, '#845c40', 9, '#726f62',
    ];
    const COLOR_BY_LOD = ['match', ['get', 'lod'], 2, '#1d508e', '#d95d2a'];

    let gsiStyle = null;   // fetched once
    async function buildStyle(sourceKey) {
      if (!gsiStyle) {
        const res = await fetch(GSI_STYLE_URL);
        if (!res.ok) throw new Error(`GSI style fetch failed: ${res.status}`);
        gsiStyle = await res.json();
      }
      const base = JSON.parse(JSON.stringify(gsiStyle));
      base.sources.bldg = { ...SOURCES[sourceKey].source, attribution: ATTRIBUTION };
      base.layers.push({
        id: 'fill-extrusion-bldg', type: 'fill-extrusion', source: 'bldg', 'source-layer': 'bldg',
        minzoom: 10, maxzoom: 20,
        filter: ['has', 'z_cm'],
        paint: {
          'fill-extrusion-color': document.getElementById('byLod').checked ? COLOR_BY_LOD : COLOR_BY_HEIGHT,
          'fill-extrusion-height': HEIGHT_M,
          'fill-extrusion-opacity': 0.95,
        },
      });
      return base;
    }

    let current = params.get('source') in SOURCES ? params.get('source') : 'mlt-pmtiles';
    const map = new maplibregl.Map({
      container: 'map',
      style: await buildStyle(current),
      center: [139.7648, 35.6812],   // 東京駅・丸の内
      zoom: 15.5, pitch: 60, bearing: -20, hash: true,
      maxPitch: 75,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
    map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }));
    map.touchZoomRotate.enableRotation();  // two-finger rotate / pitch on touch devices
    window.map = map;  // for debugging in the console

    // On phones start with the panel collapsed so the map is visible; remember the user's choice.
    const details = document.getElementById('panelDetails');
    const isPhone = window.matchMedia('(max-width: 600px)').matches;
    try {
      const saved = localStorage.getItem('panelOpen');
      details.open = saved !== null ? saved === '1' : !isPhone;
    } catch (_) { details.open = !isPhone; }
    details.addEventListener('toggle', () => { try { localStorage.setItem('panelOpen', details.open ? '1' : '0'); } catch (_) {} });

    // --- UI -----------------------------------------------------------------
    const sourcesDiv = document.getElementById('sources');
    for (const [key, def] of Object.entries(SOURCES)) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio'; input.name = 'source'; input.value = key; input.checked = key === current;
      input.addEventListener('change', () => switchSource(key));
      label.append(input, ' ', def.label);
      sourcesDiv.append(label);
    }
    document.getElementById('byLod').addEventListener('change', (e) => {
      map.setPaintProperty('fill-extrusion-bldg', 'fill-extrusion-color', e.target.checked ? COLOR_BY_LOD : COLOR_BY_HEIGHT);
    });

    // --- simple transfer statistics for the building PMTiles (via Resource Timing) ---
    const stats = { tiles: 0, bytes: 0 };
    const statsDiv = document.getElementById('stats');
    function isTileRequest(name) {
      return name.includes(`/${NAME}.mlt.pmtiles`) || name.includes(`/${NAME}.mvt.pmtiles`);
    }
    const observer = new PerformanceObserver((list) => {
      for (const e of list.getEntries()) {
        if (!isTileRequest(e.name)) continue;
        stats.tiles += 1;
        stats.bytes += e.transferSize || e.encodedBodySize || 0;
      }
      render();
    });
    observer.observe({ type: 'resource', buffered: true });
    function render() {
      statsDiv.textContent =
        `${SOURCES[current].label}\n` +
        `建物タイル リクエスト: ${stats.tiles}  転送量: ${(stats.bytes / 1024).toFixed(0)} KB\n` +
        `(PMTiles は Range リクエスト単位。ソース切替でリセット)`;
    }
    render();

    async function switchSource(key) {
      current = key;
      stats.tiles = 0; stats.bytes = 0;
      performance.clearResourceTimings();
      map.setStyle(await buildStyle(key));
      render();
    }

    map.on('error', (e) => {
      const err = e && e.error ? e.error : e;
      console.error('[map error]', err && err.message ? err.message : err, e && e.tile ? `tile ${e.tile.tileID.canonical.z}/${e.tile.tileID.canonical.x}/${e.tile.tileID.canonical.y}` : '', e && e.sourceId ? `source ${e.sourceId}` : '');
    });
    map.on('click', 'fill-extrusion-bldg', (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`高さ ${(p.z_cm / 100).toFixed(1)} m<br>lod ${p.lod}${p.id ? '<br>id ' + p.id : ''}`)
        .addTo(map);
    });
  </script>
</body>
</html>
